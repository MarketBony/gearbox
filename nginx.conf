server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Actifs hashés par Vite (assets/index-XXXXXXXX.js) ──
    # Le nom de fichier change à chaque build : on peut donc les mettre en cache
    # agressivement, il est impossible de servir une ancienne version sous le
    # même nom. `immutable` évite en plus les requêtes de revalidation.
    # Un seul mécanisme (add_header) et pas `expires`, qui émettrait un second
    # en-tête Cache-Control concurrent.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── index.html : revalidation OBLIGATOIRE ──
    # C'est lui qui référence le bundle courant. Sans en-tête, le navigateur
    # applique un cache heuristique et peut resservir un index.html périmé après
    # un déploiement, donc charger l'ancien bundle — exactement le piège qui a
    # fait croire deux fois que le temps réel ne fonctionnait pas (29/07/2026).
    # `no-cache` autorise le stockage mais impose une revalidation : combiné à
    # l'ETag de nginx, le coût réel est une réponse 304 vide.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Fichiers de public/ (logo-white.svg, logo-color.svg, favicon...) : noms
        # STABLES, non hashés. Ils doivent être revalidés, sinon remplacer un
        # logo ne serait pas visible avant l'expiration du cache.
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
