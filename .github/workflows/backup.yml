# Backup hebdomadaire Supabase : pg_dump gzippé committé dans backups/ du dépôt.
# Choix "commit dans le repo" plutôt que stockage externe : gratuit, durable,
# zéro identifiant supplémentaire, et l'historique git trace chaque sauvegarde.
# Contrepartie assumée : LE DÉPÔT DOIT RESTER PRIVÉ (les dumps contiennent les
# données), et les dumps purgés restent dans l'historique git. Rétention : les
# 8 derniers dumps (~2 mois d'hebdomadaires) pour contenir la taille du dépôt.
# Secret requis : SUPABASE_DB_URL (URL Session pooler — la même que keep-alive).
name: Supabase backup

on:
  schedule:
    - cron: '43 3 * * 1' # chaque lundi à 03:43 UTC
  workflow_dispatch: {} # déclenchement manuel pour le premier test

concurrency:
  group: supabase-backup
  cancel-in-progress: false

permissions:
  contents: write # nécessaire pour committer le dump avec le GITHUB_TOKEN

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Le pg_dump du runner (v16) refuserait un serveur Postgres plus récent :
      # on installe le client 17 depuis le dépôt officiel PGDG (compatible
      # avec les serveurs 15/16/17 de Supabase).
      - name: Installer postgresql-client-17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: pg_dump gzippé
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL manquant (à créer dans Settings > Secrets and variables > Actions)"
            exit 1
          fi
          mkdir -p backups
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          # --no-owner/--no-privileges : dump restaurable sur n'importe quel rôle.
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-privileges \
            | gzip > "backups/gearbox-${STAMP}.sql.gz"
          ls -lh "backups/gearbox-${STAMP}.sql.gz"

      - name: Rétention (garder les 8 derniers dumps)
        run: |
          ls -1 backups/gearbox-*.sql.gz | sort -r | tail -n +9 | xargs -r rm -f
          ls -1 backups/

      - name: Commit et push du dump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "Rien à committer (dump identique ?)"
          else
            git commit -m "backup: dump Supabase $(date -u +%F)"
            git push
          fi
# (réindexation forcée)
