services:
  api:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      JWT_SECRET: ${JWT_SECRET}
      # Web Push : les VALEURS vivent dans le .env du VPS (hors git). Une variable
      # absente de cette liste n'atteint PAS le conteneur, même présente dans le
      # .env — les deux vont ensemble, sinon l'envoi échoue silencieusement.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # Recherche de GIF (Giphy). Même règle que ci-dessus : la valeur vit dans le
      # .env du VPS, mais SANS cette ligne elle n'atteint pas le conteneur.
      # Absente ou vide, le bouton GIF est simplement masqué (la route rend 503).
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      # Google Forms (rubrique Forms, 01/10/2026) : valeurs dans le .env du VPS, hors git.
      # GOOGLE_TOKEN_KEY DOIT être identique à celle du poste local (le backend local écrit en prod).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_TOKEN_KEY: ${GOOGLE_TOKEN_KEY:-}
      # Forms Bony (01/10/2026) : adresse du Worker Cloudflare et secret partagé (même valeur que
      # `wrangler secret put GEARBOX_SECRET` du Worker). Valeurs dans le .env du VPS.
      FORMS_WORKER_URL: ${FORMS_WORKER_URL:-}
      FORMS_WORKER_SECRET: ${FORMS_WORKER_SECRET:-}
      NODE_ENV: production
      PORT: 3000
    volumes:
      - uploads_data:/app/uploads
      # Forms Bony F3 (01/10/2026) : fichiers déposés par les répondants. Volume À PART, jamais servi en
      # direct (uploads_data l'est par /uploads/) : lu seulement par une route avec JWT + rôle Forms.
      - bonyforms_files:/app/forms-files
    networks:
      - app-network
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - app-network

volumes:
  uploads_data:
  bonyforms_files:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
