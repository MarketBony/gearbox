services:
  api:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      JWT_SECRET: ${JWT_SECRET}
      # Web Push : les VALEURS vivent dans le .env du VPS (hors git). Une variable
      # absente de cette liste n'atteint PAS le conteneur, même présente dans le
      # .env — les deux vont ensemble, sinon l'envoi échoue silencieusement.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # Recherche de GIF (Giphy). Même règle que ci-dessus : la valeur vit dans le
      # .env du VPS, mais SANS cette ligne elle n'atteint pas le conteneur.
      # Absente ou vide, le bouton GIF est simplement masqué (la route rend 503).
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      # Google Forms (rubrique Forms, 01/10/2026) : valeurs dans le .env du VPS, hors git.
      # GOOGLE_TOKEN_KEY DOIT être identique à celle du poste local (le backend local écrit en prod).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_TOKEN_KEY: ${GOOGLE_TOKEN_KEY:-}
      # Forms Bony (01/10/2026) : adresse du Worker Cloudflare et secret partagé (même valeur que
      # `wrangler secret put GEARBOX_SECRET` du Worker). Valeurs dans le .env du VPS.
      FORMS_WORKER_URL: ${FORMS_WORKER_URL:-}
      FORMS_WORKER_SECRET: ${FORMS_WORKER_SECRET:-}
      # Assistant IA mIAouss (08/10/2026) : Qwen3.8 27B chez Groq puis Cloudflare Workers AI, offres GRATUITES.
      # Valeurs dans le .env du VPS. Absentes, la rubrique répond « pas configuré » (503).
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_AI_TOKEN: ${CLOUDFLARE_AI_TOKEN:-}
      # Relais Gemini 3.5 Flash-Lite (28/10/2026) : pris quand Groq a épuisé son quota (200 000 jetons/jour). Absente,
      # le relais est simplement sauté. ASSISTANT_CHAIN (facultatif) change l'ordre : « groq,gemini,cloudflare » par défaut.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ASSISTANT_CHAIN: ${ASSISTANT_CHAIN:-}
      # Météo (relais /api/weather, 12/10/2026) : la clé ne doit plus figurer dans le code client.
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      # CRM / RCU (12/10/2026) : base dédiée `rcu-db` ci-dessous, sur le réseau interne seulement.
      RCU_DATABASE_URL: postgresql://rcu:${RCU_DB_PASSWORD}@rcu-db:5432/rcu
      NODE_ENV: production
      PORT: 3000
    volumes:
      - uploads_data:/app/uploads
      # Forms Bony F3 (01/10/2026) : fichiers déposés par les répondants. Volume À PART, jamais servi en
      # direct (uploads_data l'est par /uploads/) : lu seulement par une route avec JWT + rôle Forms.
      - bonyforms_files:/app/forms-files
    networks:
      - app-network
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  # ─── CRM / RCU (référentiel client unique, 12/10/2026) ─────────────────────────────
  # Base DÉDIÉE : elle ne quitte jamais le VPS (ni Supabase, ni dump GitHub). AUCUN port publié :
  # joignable seulement par `api` et `rcu-worker` sur le réseau interne (le pare-feu ufw du VPS est inactif).
  rcu-db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: rcu
      POSTGRES_USER: rcu
      POSTGRES_PASSWORD: ${RCU_DB_PASSWORD}
    volumes:
      - rcu_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Import du soir : surveille le dossier de dépôt SFTP (/srv/dcs/depot, compte `dcs`), applique les
  # migrations du RCU au démarrage, archive les fichiers 14 jours (/srv/rcu/archive, root seul).
  rcu-worker:
    build: ./backend
    restart: always
    environment:
      RCU_DATABASE_URL: postgresql://rcu:${RCU_DB_PASSWORD}@rcu-db:5432/rcu
      RCU_DEPOT: /depot
      RCU_ARCHIVE: /archive
      NODE_ENV: production
    volumes:
      - /srv/dcs/depot:/depot
      - /srv/rcu/archive:/archive
    depends_on:
      - rcu-db
    networks:
      - app-network
    command: node dist/rcu/worker.js

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - app-network

volumes:
  rcu_data:
  uploads_data:
  bonyforms_files:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
