
<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEARBOX – Plaque Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts: Syncopate & Albert Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <script>
      tailwind.config = {
        darkMode: 'class', // Activation manuelle via classe 'dark'
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Albert Sans"', 'sans-serif'],
              title: ['"Syncopate"', 'sans-serif'],
            },
            colors: {
              bony: {
                orange: '#f75632',
                violet: '#8f12ab',
                blue: '#293f74',
                // Utilisation de variables CSS pour le theming
                dark: 'var(--bg-main)',  
                panel: 'var(--bg-panel)', 
                border: 'var(--border-color)',
                text: 'var(--text-main)',
                muted: 'var(--text-muted)',
                input: 'var(--bg-input)'
              },
              gearbox: { 
                dark: 'var(--bg-main)',
                panel: 'var(--bg-panel)',
                accent: '#f75632', 
              }
            },
            backgroundImage: {
              'bony-gradient': 'linear-gradient(to right, #f75632, #8f12ab)',
              'bony-gradient-hover': 'linear-gradient(to right, #ff6b4a, #a62bc4)',
            },
            // ── Liquid Glass (additif — ne touche pas à la charte) ──
            borderRadius: {
              '4xl': '2rem',
              '5xl': '2.5rem',
            },
            boxShadow: {
              // Ombres douces et diffuses (jamais dures)
              'soft':    '0 1px 2px rgba(16,18,32,0.04), 0 4px 16px rgba(16,18,32,0.06)',
              'soft-lg': '0 2px 8px rgba(16,18,32,0.05), 0 16px 40px -8px rgba(16,18,32,0.12)',
              'soft-xl': '0 4px 12px rgba(16,18,32,0.06), 0 32px 64px -16px rgba(16,18,32,0.18)',
              'glass':    '0 8px 32px -4px rgba(16,18,32,0.12), inset 0 1px 0 0 rgba(255,255,255,0.45)',
              'glass-lg': '0 24px 64px -12px rgba(16,18,32,0.22), inset 0 1px 0 0 rgba(255,255,255,0.5)',
              // Glow recolorés charte Bony (orange + violet)
              'glow':        '0 8px 28px -6px rgba(247,86,50,0.45)',
              'glow-violet': '0 8px 28px -6px rgba(143,18,171,0.40)',
            },
            transitionTimingFunction: {
              'apple':  'cubic-bezier(0.25, 0.1, 0.25, 1)',
              'spring': 'cubic-bezier(0.34, 1.56, 0.64, 1)',
            }
          }
        }
      }
    </script>
    <style>
      /* DEFINITION DU THEME */
      :root {
        /* Mode Clair */
        --bg-main: #f1f5f9;      /* Slate 100 - Fond général */
        --bg-panel: #ffffff;     /* White - Panneaux */
        --bg-input: #f8fafc;     /* Slate 50 - Inputs */
        --border-color: #cbd5e1; /* Slate 300 - Bordures plus visibles */
        --text-main: #0f172a;    /* Slate 900 - Texte principal */
        --text-muted: #64748b;   /* Slate 500 - Texte secondaire */

        /* Verre (liquid glass) — dépoli plus marqué (moins opaque, plus flou) */
        --glass-bg:        rgba(255,255,255,0.45);
        --glass-bg-strong: rgba(255,255,255,0.72);
        --glass-border:    rgba(255,255,255,0.75);
        --glass-blur:      30px;

        /* Verre DENSE pour panneaux de menu/dropdown/calendrier (frosted lisible,
           masque le fond même chargé). Réservé aux panneaux de texte flottants. */
        --glass-menu-bg:     rgba(255,255,255,0.90);
        --glass-menu-border: rgba(255,255,255,0.90);

        /* Washes d'accent du fond (charte Bony : orange + violet + bleu) — plus présents */
        --wash-1: rgba(247,86,50,0.16);
        --wash-2: rgba(143,18,171,0.15);
        --wash-3: rgba(41,63,116,0.12);
      }

      html.dark {
        /* Mode Sombre */
        --bg-main: #121212;      /* Noir profond */
        --bg-panel: #1E1E1E;     /* Gris foncé */
        --bg-input: rgba(0, 0, 0, 0.2); /* Fond inputs */
        --border-color: #333333; /* Bordures subtiles */
        --text-main: #ffffff;    /* Blanc */
        --text-muted: #94a3b8;   /* Slate 400 */

        /* Verre — glassmorphism sombre cohérent (pas un simple inverse) */
        --glass-bg:        rgba(28,28,36,0.50);
        --glass-bg-strong: rgba(30,30,38,0.72);
        --glass-border:    rgba(255,255,255,0.12);
        --glass-blur:      30px;

        --glass-menu-bg:     rgba(24,24,30,0.92);
        --glass-menu-border: rgba(255,255,255,0.14);

        --wash-1: rgba(247,86,50,0.20);
        --wash-2: rgba(143,18,171,0.18);
        --wash-3: rgba(41,63,116,0.16);
      }

      /* ===================== VERRE (liquid glass) ===================== */
      * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

      /* Surface translucide premium — sidebar, navbars, modales, dropdowns, cartes flottantes */
      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur)) saturate(200%);
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(200%);
        border: 1px solid var(--glass-border);
        /* Profondeur : highlight interne haut (bordure lumineuse) + ombre portée diffuse */
        box-shadow: 0 8px 32px -6px rgba(16,18,32,0.18), inset 0 1px 0 0 rgba(255,255,255,0.55);
      }
      /* Variante plus opaque — quand la lisibilité du texte par-dessus est requise */
      .glass-strong {
        background: var(--glass-bg-strong);
        backdrop-filter: blur(var(--glass-blur)) saturate(200%);
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(200%);
        border: 1px solid var(--glass-border);
        box-shadow: 0 8px 32px -6px rgba(16,18,32,0.18), inset 0 1px 0 0 rgba(255,255,255,0.55);
      }
      html.dark .glass, html.dark .glass-strong {
        box-shadow: 0 10px 36px -8px rgba(0,0,0,0.55), inset 0 1px 0 0 rgba(255,255,255,0.12);
      }
      /* Reflet lumineux supérieur (combiner avec position:relative + overflow-hidden) */
      .glass-sheen::before {
        content: '';
        position: absolute;
        inset: 0 0 auto 0;
        height: 50%;
        background: linear-gradient(to bottom, rgba(255,255,255,0.55), rgba(255,255,255,0.06) 62%, transparent);
        pointer-events: none;
        opacity: 0.9;
      }
      html.dark .glass-sheen::before {
        background: linear-gradient(to bottom, rgba(255,255,255,0.14), rgba(255,255,255,0.02) 62%, transparent);
        opacity: 0.8;
      }

      /* ===== VERRE DENSE — panneaux de menu / dropdown / calendrier =====
         Frosted opaque (masque le fond chargé), blur fort + saturation, bordure claire,
         reflet haut (.glass-sheen), ombre portée profonde. Texte toujours lisible. */
      .glass-menu {
        background: var(--glass-menu-bg);
        backdrop-filter: blur(28px) saturate(200%);
        -webkit-backdrop-filter: blur(28px) saturate(200%);
        border: 1px solid var(--glass-menu-border);
        box-shadow:
          0 20px 50px -12px rgba(16,18,32,0.35),
          0 4px 12px -2px rgba(16,18,32,0.18),
          inset 0 1px 0 0 rgba(255,255,255,0.6);
      }
      html.dark .glass-menu {
        box-shadow:
          0 24px 60px -12px rgba(0,0,0,0.72),
          0 4px 12px -2px rgba(0,0,0,0.5),
          inset 0 1px 0 0 rgba(255,255,255,0.10);
      }
      /* Fallback navigateurs sans backdrop-filter : rendre quasi-opaque pour la lisibilité */
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .glass-menu { background: var(--bg-panel); }
      }

      /* ===== BOUTONS DÉGRADÉ BONY — relief + feedback (UI only) =====
         Reflet sheen par-dessus le dégradé, profondeur, survol lumineux, appui élastique.
         Dégradé/texte blanc inchangés. Cible uniquement les vrais boutons/liens (pas les
         barres de progression/bandes déco en <div>, ni les textes .bg-clip-text). */
      button.bg-bony-gradient:not(.bg-clip-text),
      a.bg-bony-gradient:not(.bg-clip-text),
      .gx-btn-gradient {
        position: relative;
        overflow: hidden;
        isolation: isolate;
        /* Fini verre sobre : ombre neutre douce + très fin liseré haut (pas de glow orange plastique) */
        box-shadow: 0 2px 6px rgba(16,18,32,0.16), inset 0 1px 0 rgba(255,255,255,0.12);
        transition: transform .14s cubic-bezier(0.34,1.56,0.64,1), box-shadow .2s ease, filter .2s ease;
      }
      button.bg-bony-gradient:not(.bg-clip-text)::after,
      a.bg-bony-gradient:not(.bg-clip-text)::after,
      .gx-btn-gradient::after {
        content: '';
        position: absolute;
        inset: 0 0 auto 0;
        height: 42%;
        /* Reflet dépoli discret, plus de highlight brillant */
        background: linear-gradient(to bottom, rgba(255,255,255,0.10), transparent 70%);
        pointer-events: none;
        z-index: -1;
      }
      button.bg-bony-gradient:not(.bg-clip-text):not(:disabled):hover,
      a.bg-bony-gradient:not(.bg-clip-text):hover,
      .gx-btn-gradient:not(:disabled):hover {
        filter: brightness(1.03);
        box-shadow: 0 4px 12px rgba(16,18,32,0.22), inset 0 1px 0 rgba(255,255,255,0.14);
      }
      button.bg-bony-gradient:not(.bg-clip-text):not(:disabled):active,
      a.bg-bony-gradient:not(.bg-clip-text):active,
      .gx-btn-gradient:not(:disabled):active {
        transform: scale(0.97);
        filter: brightness(0.99);
        box-shadow: 0 1px 4px rgba(16,18,32,0.2), inset 0 2px 5px rgba(0,0,0,0.14);
      }

      /* Carte de contenu standard (opaque, douce) — le verre reste un accent, pas le fond partout */
      .gx-card {
        background: var(--bg-panel);
        border: 1px solid var(--border-color);
        border-radius: 1.25rem; /* 20px */
        box-shadow: 0 1px 2px rgba(16,18,32,0.04), 0 4px 16px rgba(16,18,32,0.06);
      }
      html.dark .gx-card { box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35); }

      /* Élévation au survol — uniquement transform/box-shadow (60fps) */
      .gx-hover-lift {
        transition: transform 0.3s cubic-bezier(0.25,0.1,0.25,1), box-shadow 0.3s cubic-bezier(0.25,0.1,0.25,1);
        will-change: transform;
      }
      .gx-hover-lift:hover {
        transform: translateY(-3px);
        box-shadow: 0 2px 8px rgba(16,18,32,0.05), 0 16px 40px -8px rgba(16,18,32,0.14);
      }
      html.dark .gx-hover-lift:hover { box-shadow: 0 16px 40px -8px rgba(0,0,0,0.5); }

      /* Pill / CTA dégradé — charte Bony (orange → violet) */
      .gx-gradient { background-image: linear-gradient(to right, #f75632, #8f12ab); }
      .gx-gradient:not(.bg-clip-text) { background-clip: padding-box; -webkit-background-clip: padding-box; }

      /* Anti-débordement du dégradé sous la bordure (coins arrondis des pills/chips/CTA).
         Le dégradé est clipé au padding-box → pas de frange aux coins. Exclut les textes
         en dégradé (.bg-clip-text : titres, logos) qui doivent garder background-clip: text. */
      .bg-bony-gradient:not(.bg-clip-text),
      .bg-bony-gradient-hover:not(.bg-clip-text) {
        background-clip: padding-box;
        -webkit-background-clip: padding-box;
      }

      /* ===================== SCROLLBAR ===================== */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(120,120,128,0.3);
        border-radius: 99px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(120,120,128,0.5);
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      .custom-scrollbar { scrollbar-width: thin; scrollbar-color: rgba(120,120,128,0.3) transparent; }

      /* ===================== ANIMATIONS UTILITAIRES ===================== */
      @keyframes gx-fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes gx-fade-up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes gx-scale-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
      .animate-fade-in  { animation: gx-fade-in 0.5s cubic-bezier(0.25,0.1,0.25,1) both; }
      .animate-fade-up  { animation: gx-fade-up 0.5s cubic-bezier(0.25,0.1,0.25,1) both; }
      .animate-scale-in { animation: gx-scale-in 0.4s cubic-bezier(0.25,0.1,0.25,1) both; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }

      body {
        background-color: var(--bg-main);
        color: var(--text-main);
        font-family: 'Albert Sans', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* Fond animé subtil : deux couches de formes floues (charte orange/violet/bleu) qui
         dérivent lentement et indépendamment en TRANSFORM (pas de background-position →
         pas de repaint). Très discret, derrière l'app, pour faire ressortir le verre.
         Login n'est pas concerné (son canvas recouvre le viewport). Gelé par
         prefers-reduced-motion via la règle globale ci-dessus. */
      body::before, body::after {
        content: '';
        position: fixed;
        inset: -30%;
        z-index: -1;
        pointer-events: none;
        background-repeat: no-repeat;
        will-change: transform;
      }
      /* Couche 1 : orange (haut-gauche) + touche bleu (haut-droite) */
      body::before {
        background-image:
          radial-gradient(38% 42% at 20% 22%,  var(--wash-1), transparent 60%),
          radial-gradient(32% 36% at 82% 14%,  var(--wash-3), transparent 62%);
        animation: gx-bg-drift-a 46s ease-in-out infinite alternate;
      }
      /* Couche 2 : violet (bas-droite) + orange (bas-gauche), dérive opposée + lente */
      body::after {
        background-image:
          radial-gradient(40% 44% at 80% 82%,  var(--wash-2), transparent 60%),
          radial-gradient(30% 34% at 24% 88%,  var(--wash-1), transparent 64%);
        animation: gx-bg-drift-b 61s ease-in-out infinite alternate;
      }
      @keyframes gx-bg-drift-a {
        from { transform: translate3d(-3%, -2%, 0) scale(1); }
        to   { transform: translate3d(4%, 3%, 0)  scale(1.08); }
      }
      @keyframes gx-bg-drift-b {
        from { transform: translate3d(3%, 2%, 0)  scale(1.05); }
        to   { transform: translate3d(-4%, -3%, 0) scale(1); }
      }

      /* Transitions douces pour les éléments de thème */
      .bg-bony-panel, .bg-bony-dark, .border-bony-border {
        transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Syncopate', sans-serif;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      
      /* Input resets for better theming */
      input, select, textarea {
        color: var(--text-main);
      }
      input::placeholder, textarea::placeholder {
        color: var(--text-muted);
        opacity: 0.7;
      }
    </style>

</script>
