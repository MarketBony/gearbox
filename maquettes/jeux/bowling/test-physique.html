<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Physique du bowling — empreintes</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; background: #fff; color: #111; }
  code { font-family: ui-monospace, monospace; }
  td, th { padding: 2px 10px; text-align: left; }
</style>
</head>
<body>
<h1>Physique du bowling : empreintes navigateur</h1>
<p>Doivent être IDENTIQUES à celles de <code>node test-physique.mjs …</code> (section Déterminisme).</p>
<table><thead><tr><th>lancer</th><th>quilles</th><th>images</th><th>empreinte</th><th>ms</th></tr></thead><tbody id="t"></tbody></table>
<p id="etat">Chargement de Rapier…</p>
<script type="module">
  import { initPhysique, simuler, emplacements } from './physique.js';
  import { REFERENCES, empreinte } from './test-physique-commun.js';
  await initPhysique();
  const E = emplacements(), t = document.getElementById('t'), out = [];
  for (const l of REFERENCES) {
    const t0 = performance.now(); const r = simuler(E, l); const ms = performance.now() - t0;
    const h = empreinte(r); out.push(h);
    t.insertAdjacentHTML('beforeend', `<tr><td><code>${JSON.stringify(l)}</code></td><td>${r.tombees}</td><td>${r.images.length}</td><td><code>${h}</code></td><td>${ms.toFixed(0)}</td></tr>`);
  }
  const rack = [{ n: 7, x: 0.47, z: 19.09, rot: 0.3 }, { n: 10, x: -0.457, z: 19.082 }];
  const h = empreinte(simuler(rack, { position: -0.3, angle: 0.03, vitesse: 7, effet: -0.5 }));
  out.push(h);
  document.getElementById('etat').textContent = 'rack partiel : ' + h + ' — terminé';
  window.EMPREINTES = out;
</script>
</body>
</html>
